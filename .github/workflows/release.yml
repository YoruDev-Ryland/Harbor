name: Release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Require tag and package versions to match
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - run: npm run ci
      - run: npm audit --omit=dev --audit-level=moderate

  publish:
    name: Publish, attest, and sign
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.35.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            HARBOR_VERSION=${{ steps.version.outputs.value }}
            HARBOR_REVISION=${{ github.sha }}
            HARBOR_SOURCE=${{ github.server_url }}/${{ github.repository }}
            HARBOR_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Install checksum-verified Trivy 0.72.0
        run: node scripts/install-trivy.mjs "$RUNNER_TEMP/trivy"
      - name: Block fixable Critical/High release-image vulnerabilities
        run: >-
          "$RUNNER_TEMP/trivy/trivy" image
          --exit-code 1
          --ignore-unfixed
          --severity CRITICAL,HIGH
          --pkg-types os,library
          --scanners vuln
          --skip-version-check
          "${{ steps.image.outputs.value }}@${{ steps.build.outputs.digest }}"
      - name: Keyless-sign the immutable manifest digest
        env:
          IMAGE: ${{ steps.image.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Generate downloadable SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.value }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          syft-version: v1.48.0
          output-file: harbor-${{ steps.version.outputs.value }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harbor-${{ steps.version.outputs.value }}-sbom
          path: harbor-${{ steps.version.outputs.value }}.spdx.json

  pull-install:
    name: Pull-based Compose verification
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Verify keyless signature
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            "${IMAGE}@${DIGEST}"
      - name: Pull and start the documented Compose artifact
        env:
          HARBOR_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          HARBOR_SECRET_HOST_FILE: ${{ runner.temp }}/harbor_secret
          HARBOR_PORT: "19090"
          COMPOSE_PROJECT_NAME: harbor-release-verify
        run: |
          openssl rand -hex 32 > "${HARBOR_SECRET_HOST_FILE}"
          chmod 600 "${HARBOR_SECRET_HOST_FILE}"
          docker compose -f deploy/compose.release.yml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19090/api/health/ready; then exit 0; fi
            sleep 1
          done
          docker compose -f deploy/compose.release.yml logs
          exit 1
      - name: Remove disposable release verification stack
        if: always()
        env:
          HARBOR_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          HARBOR_SECRET_HOST_FILE: ${{ runner.temp }}/harbor_secret
          HARBOR_PORT: "19090"
          COMPOSE_PROJECT_NAME: harbor-release-verify
        run: docker compose -f deploy/compose.release.yml down --volumes
